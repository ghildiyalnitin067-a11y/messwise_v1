version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messwise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=MessWise
      - SECRET_KEY=messwise-super-secure-production-key-2025
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite+aiosqlite:///./messwise.db
      - BACKEND_CORS_ORIGINS=["*"]
      - AUTO_SEED_DATA=true
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    container_name: messwise_admin_portal
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1

  student-portal:
    build:
      context: ./student-portal
      dockerfile: Dockerfile
    container_name: messwise_student_portal
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1

  ngo-portal:
    build:
      context: ./ngo-portal
      dockerfile: Dockerfile
    container_name: messwise_ngo_portal
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1

volumes:
  backend_data:
