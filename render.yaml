services:
  # Backend FastAPI Web Service
  - type: web
    name: messwise-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: MessWise
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./messwise.db
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: AUTO_SEED_DATA
        value: "true"

  # Standalone Mess Admin Portal
  - type: web
    name: messwise-admin
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: admin-portal
    envVars:
      - key: VITE_API_URL
        value: https://messwise-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Standalone Student Portal
  - type: web
    name: messwise-student
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: student-portal
    envVars:
      - key: VITE_API_URL
        value: https://messwise-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Standalone NGO Food Rescue Portal
  - type: web
    name: messwise-ngo
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: ngo-portal
    envVars:
      - key: VITE_API_URL
        value: https://messwise-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
