services:
  # Backend FastAPI Web Service
  - type: web
    name: messwise-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: MessWise
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./messwise.db
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: AUTO_SEED_DATA
        value: "true"

  # Unified Frontend & Portal Hub
  - type: web
    name: messwise-portal
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://messwise-api.onrender.com/api/v1
      - key: VITE_STUDENT_PORTAL_URL
        value: https://messwise-student.vercel.app
      - key: VITE_ADMIN_PORTAL_URL
        value: https://messwise-admin.vercel.app
      - key: VITE_NGO_PORTAL_URL
        value: https://messwise-ngo.vercel.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
